<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Book App logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6CF2"/>
      <stop offset="100%" stop-color="#4C3FD1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="120" fill="url(#bg)"/>
  <!-- open book -->
  <g transform="translate(300 270)">
    <path d="M0 -40 C -50 -80, -130 -85, -175 -70 L -175 105 C -130 92, -50 95, 0 130 Z" fill="#FFFFFF"/>
    <path d="M0 -40 C 50 -80, 130 -85, 175 -70 L 175 105 C 130 92, 50 95, 0 130 Z" fill="#E9E5FF"/>
    <path d="M0 -40 L 0 130" stroke="#4C3FD1" stroke-width="6"/>
    <g stroke="#B9B0F7" stroke-width="9" stroke-linecap="round">
      <line x1="-140" y1="-30" x2="-40" y2="-15"/>
      <line x1="-140" y1="5" x2="-40" y2="20"/>
      <line x1="-140" y1="40" x2="-60" y2="52"/>
      <line x1="40" y1="-15" x2="140" y2="-30"/>
      <line x1="40" y1="20" x2="140" y2="5"/>
    </g>
    <!-- magnifier hint for discovery -->
    <circle cx="105" cy="62" r="34" fill="none" stroke="#FFB547" stroke-width="12"/>
    <line x1="129" y1="86" x2="160" y2="117" stroke="#FFB547" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="300" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="6" fill="#FFFFFF">BOOK APP</text>
</svg>
